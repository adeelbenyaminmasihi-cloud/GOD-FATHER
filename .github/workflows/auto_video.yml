name: GenZ Carry-Style Roast Pipeline

on:
  schedule:
    # Runs at 2:00 PM PKT (09:00 UTC) and 9:00 PM PKT (16:00 UTC) daily
    - cron: '0 9,16 * * *'
  workflow_dispatch: # Allows manual 1-click run from Actions tab

permissions:
  contents: write # Required so the bot can auto-save topics_history.json

jobs:
  build-and-post-roast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and Send Roast Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Save Topic Memory to Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add topics_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update roasted topics history [skip ci]" && git push)
