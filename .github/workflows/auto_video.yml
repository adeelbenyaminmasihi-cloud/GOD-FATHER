name: GenZ Carry-Style Roast Pipeline

on:
  schedule:
    - cron: '0 9,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-post-roast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies Directly
        run: |
          pip install --upgrade pip
          pip install requests==2.32.3 edge-tts==6.1.19

      - name: Ensure History File Exists and Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ ! -f topics_history.json ]; then echo "[]" > topics_history.json; fi
          python main.py

      - name: Save Topic Memory to Repository
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add topics_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update roasted topics history [skip ci]" && git push)
